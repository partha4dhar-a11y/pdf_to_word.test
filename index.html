<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite PDF to Word Converter</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/docx@7.3.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <style>
        :root {
            --bg-dark: #07070a;
            --surface: rgba(25, 25, 35, 0.6);
            --surface-hover: rgba(35, 35, 45, 0.8);
            --accent-primary: #ffd700; /* Gold */
            --accent-glow: rgba(255, 215, 0, 0.4);
            --text-main: #f0f0f5;
            --text-muted: #888899;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background Glow */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 8s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.1; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.2; }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 650px;
            padding: 40px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUpFade 0.8s forwards;
        }

        @keyframes slideUpFade {
            to { transform: translateY(0); opacity: 1; }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 400;
        }

        /* Drag & Drop Zone */
        .drop-zone {
            border: 2px dashed var(--border-subtle);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .drop-zone.dragover {
            border-color: var(--accent-primary);
            background: rgba(255, 215, 0, 0.05);
            transform: scale(1.02);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .drop-zone i {
            font-size: 48px;
            color: var(--accent-primary);
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .drop-zone.dragover i {
            transform: translateY(-10px);
        }

        .drop-zone h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .drop-zone p {
            font-size: 13px;
            color: var(--text-muted);
        }

        input[type="file"] {
            display: none;
        }

        /* Progress UI */
        .processing-ui {
            display: none;
            text-align: center;
            padding: 40px 0;
        }

        .processing-ui h3 {
            font-size: 18px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-primary);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--accent-primary);
            transition: width 0.3s ease;
        }

        .status-text {
            margin-top: 15px;
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Result UI */
        .result-ui {
            display: none;
            text-align: center;
            padding: 20px 0;
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .result-icon {
            font-size: 60px;
            color: #4cd137;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(76, 209, 55, 0.4);
        }

        .btn-download {
            background: var(--text-main);
            color: var(--bg-dark);
            border: none;
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-download:hover {
            background: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.2);
        }

        .btn-reset {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 20px;
            margin-left: 10px;
        }

        .btn-reset:hover {
            color: var(--text-main);
            border-color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="container">
        <div class="header">
            <h1>PDF Processing Engine</h1>
            <p>High-Fidelity Text Extraction to .DOCX</p>
        </div>

        <!-- State 1: Upload -->
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <h3>Drag & Drop your PDF</h3>
            <p>or click to browse local files</p>
            <input type="file" id="fileInput" accept="application/pdf">
        </div>

        <!-- State 2: Processing -->
        <div class="processing-ui" id="processingUI">
            <h3 id="processingTitle">Analyzing Document...</h3>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="status-text" id="statusText">Initializing core engine...</div>
        </div>

        <!-- State 3: Result -->
        <div class="result-ui" id="resultUI">
            <i class="fa-solid fa-circle-check result-icon"></i>
            <h2>Conversion Complete</h2>
            <p style="color: var(--text-muted); margin-top: 10px;" id="fileStats">Successfully processed X pages.</p>
            
            <button class="btn-download" id="downloadBtn">
                <i class="fa-solid fa-file-word"></i> Save as Word Document
            </button>
            <button class="btn-reset" onclick="resetApp()">
                Convert Another
            </button>
        </div>
    </div>

    <script>
        // PDF.js worker setup
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const processingUI = document.getElementById('processingUI');
        const resultUI = document.getElementById('resultUI');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const processingTitle = document.getElementById('processingTitle');
        let currentBlob = null;
        let originalFileName = "";

        // UI Event Listeners
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });

        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            
            if (file.type !== "application/pdf") {
                alert("Protocol Error: Only PDF files are supported in this engine.");
                return;
            }

            originalFileName = file.name.replace('.pdf', '');
            startConversion(file);
        }

        async function startConversion(file) {
            // UI Transition
            dropZone.style.display = 'none';
            processingUI.style.display = 'block';
            updateProgress(10, 'Loading file into memory buffer...');

            try {
                // Read File
                const arrayBuffer = await file.arrayBuffer();
                updateProgress(20, 'Parsing PDF structure...');

                // Load PDF
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const totalPages = pdf.numPages;
                let fullTextData = [];

                // Extract Text Loop
                for (let i = 1; i <= totalPages; i++) {
                    let progress = 20 + Math.floor((i / totalPages) * 50);
                    updateProgress(progress, `Extracting vector text: Page ${i} of ${totalPages}...`);
                    
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    
                    // Combine text items, add basic line breaks based on Y-axis positioning
                    let pageText = "";
                    let lastY = -1;
                    
                    textContent.items.forEach(item => {
                        if (lastY !== item.transform[5] && lastY !== -1) {
                            pageText += "\n";
                        }
                        pageText += item.str + " ";
                        lastY = item.transform[5];
                    });

                    fullTextData.push(pageText);
                }

                updateProgress(75, 'Constructing .DOCX schemas...');

                // Build Word Document using docx.js
                const docParagraphs = [];
                
                fullTextData.forEach((pageContent, index) => {
                    // Split text by newlines and create Word paragraphs
                    const lines = pageContent.split('\n');
                    lines.forEach(line => {
                        if (line.trim().length > 0) {
                            docParagraphs.push(
                                new docx.Paragraph({
                                    children: [
                                        new docx.TextRun({
                                            text: line.trim(),
                                            font: "Calibri",
                                            size: 24, // 12pt
                                        })
                                    ],
                                    spacing: { after: 200 }
                                })
                            );
                        }
                    });

                    // Add Page Break after each page except the last
                    if (index < fullTextData.length - 1) {
                        docParagraphs.push(new docx.Paragraph({ children: [new docx.PageBreak()] }));
                    }
                });

                const doc = new docx.Document({
                    sections: [{
                        properties: {},
                        children: docParagraphs
                    }]
                });

                updateProgress(90, 'Compiling binary output...');

                // Generate Blob
                currentBlob = await docx.Packer.toBlob(doc);

                updateProgress(100, 'Conversion successful.');
                
                // Show Result UI
                setTimeout(() => {
                    processingUI.style.display = 'none';
                    resultUI.style.display = 'block';
                    document.getElementById('fileStats').innerText = `Successfully processed ${totalPages} pages.`;
                }, 800);

            } catch (error) {
                console.error(error);
                statusText.innerText = "Error parsing document. It might be encrypted or scanned.";
                statusText.style.color = "#ff4757";
                processingTitle.innerText = "Conversion Failed";
                progressBar.style.background = "#ff4757";
            }
        }

        function updateProgress(percent, text) {
            progressBar.style.width = percent + '%';
            statusText.innerText = text;
        }

        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (currentBlob) {
                saveAs(currentBlob, `${originalFileName}_Converted.docx`);
            }
        });

        function resetApp() {
            resultUI.style.display = 'none';
            dropZone.style.display = 'block';
            fileInput.value = '';
            currentBlob = null;
            progressBar.style.width = '0%';
            progressBar.style.background = 'var(--accent-primary)';
            processingTitle.innerText = "Analyzing Document...";
        }
    </script>
</body>
</html>
